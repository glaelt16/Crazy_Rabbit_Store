<div class="hero-section">
  <div class="hero-content">
    <img src="/assets/images/CrazyRabbit.png" alt="Crazy Rabbit Logo" class="hero-logo">
    <h1 class="hero-title">Elevate Your Style</h1>
    <p class="hero-subtitle">Discover our latest collection of premium apparel.</p>
    <a routerLink="/products" class="btn btn-primary">Shop Collection</a>
  </div>
</div>

<div class="products-section">
  <div class="section-header">
    <h2>Featured Products</h2>
    <p>Explore our carefully curated selection</p>
  </div>
  <div class="grid">
    <app-product-card *ngFor="let p of products$ | async" [product]="p" />
  </div>
</div>
