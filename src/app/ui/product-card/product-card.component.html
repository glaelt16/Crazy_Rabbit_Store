<div class="card" [class.is-zoomed]="isZoomed">
  <div class="image-gallery" [class.zoomed]="isZoomed">
    <button class="close-zoom-btn" *ngIf="isZoomed" (click)="toggleZoom()">&times;</button>
    <button class="nav-btn prev" (click)="prevImage($event)">&#10094;</button>
    <img [src]="product.images[currentImageIndex]" [alt]="product.name" (click)="toggleZoom()" />
    <button class="nav-btn next" (click)="nextImage($event)">&#10095;</button>
  </div>

  <div class="card-content">
    <div class="card-header">
      <h3 class="product-name">{{ product.name }}</h3>
      <p class="price">${{ product.price }}</p>
    </div>

    <p class="desc">{{ product.description }}</p>

    <div class="selectors" *ngIf="product.colors || product.sizes">
      <div class="color-selector" *ngIf="product.colors">
        <span class="selector-label">Color:</span>
        <div class="color-options">
          <span
            *ngFor="let color of product.colors"
            class="color-option"
            [style.background-color]="color.name.toLowerCase()"
            (click)="selectColor(color)"
            [class.selected]="color === selectedColor"
            [title]="color.name"
          ></span>
        </div>
      </div>

      <div class="size-selector" *ngIf="product.sizes">
        <span class="selector-label">Size:</span>
        <select [(ngModel)]="selectedSize" class="modern-select">
          <option value="">Choose size</option>
          <option *ngFor="let size of product.sizes" [value]="size">
            {{ size }}
          </option>
        </select>
      </div>
    </div>

    <div class="buttons">
      <button class="btn btn-add" (click)="addToCart()">
        <i class="bi bi-cart-plus"></i> Add to Cart
      </button>
      <a
        *ngIf="product.amazonLink"
        [href]="product.amazonLink"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-amazon"
        (click)="notifyAmazonLinkClick()"
      >
        <i class="bi bi-amazon"></i> Amazon
      </a>
    </div>
  </div>
</div>
