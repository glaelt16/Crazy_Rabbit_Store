<div class="modal-overlay" [class.hidden]="!modalService.isOpen$()" (click)="modalService.close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2><i class="bi bi-check-circle-fill text-success"></i> Added to Cart</h2>
      <button class="close-btn" (click)="modalService.close()">&times;</button>
    </div>

    <div class="modal-body" *ngIf="cartService.cartItems().length > 0; else emptyCart">
      <div class="cart-items-list">
        <div class="cart-item" *ngFor="let item of cartService.cartItems()">
          <div class="item-info">
            <span class="item-name">{{ item.name }}</span>
            <div class="item-meta">
              <span *ngIf="item.color">Color: {{ item.color.name }}</span>
              <span *ngIf="item.size">Size: {{ item.size }}</span>
            </div>
          </div>
          <div class="item-price-action">
            <span class="item-price">{{ item.price | currency }} x {{ item.qty }}</span>
            <button class="remove-btn" (click)="cartService.remove(item.id, item.size, item.color)">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="cart-total">
        <span>Total:</span>
        <span class="total-amount">{{ cartService.total() | currency }}</span>
      </div>
    </div>

    <ng-template #emptyCart>
      <div class="modal-body empty-state">
        <p>Your cart is empty.</p>
      </div>
    </ng-template>

    <div class="modal-actions">
      <button class="btn btn-secondary" (click)="modalService.close()">Continue Shopping</button>
      <a routerLink="/checkout" class="btn btn-primary" (click)="modalService.close()">Go to Checkout</a>
    </div>
  </div>
</div>
